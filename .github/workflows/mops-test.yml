name: mops test

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: dfinity/setup-mops@main
        with:
          moc-version: '1.14.0'

      - name: install mops packages and pinned moc
        run: npm run mops:setup

      - name: run tests
        run: mops test
